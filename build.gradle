plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2' apply false
}

allprojects {
    group = 'com.example'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_13
        targetCompatibility = JavaVersion.VERSION_13
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
        implementation 'org.assertj:assertj-core:3.24.2'
        implementation 'io.qameta.allure:allure-java-commons:2.24.0'
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
            showStandardStreams = true
        }
    }
}

// ============================================================
// ЗАВИСИМОСТИ ДЛЯ СТАРОГО src/ (Темы 1-10)
// ============================================================
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'com.codeborne:selenide:6.19.1'
    testImplementation 'io.rest-assured:rest-assured:5.5.6'
    testImplementation 'io.qameta.allure:allure-junit5:2.24.0'
    testImplementation 'io.qameta.allure:allure-selenide:2.24.0'
    testImplementation 'io.qameta.allure:allure-rest-assured:2.24.0'
}

// Задача Smoke-прогона (API + UI)
tasks.register('smoke') {
    group = 'verification'
    description = 'Smoke-прогон API + UI'
    dependsOn ':api-tests:apiSmoke', ':ui-tests:uiSmoke'
}