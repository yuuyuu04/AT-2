plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'   // ✅ Allure-плагин
}

group = 'com.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'

    // Selenide
    implementation 'com.codeborne:selenide:6.19.1'

    // Selenide + Allure
    implementation 'io.qameta.allure:allure-selenide:2.24.0'

    // REST Assured + Allure
    implementation 'io.rest-assured:rest-assured:5.5.6'
    implementation 'io.qameta.allure:allure-rest-assured:2.24.0'

    // AssertJ
    implementation 'org.assertj:assertj-core:3.24.2'
}

allure {
    version = '2.24.0'
    autoconfigure = true
    aspectjweaver = true
    useJUnit5 {
        version = '2.24.0'
    }
}

//  задача с параметрами
tasks.register('allureServeLocal', Exec) {
    group = 'verification'
    description = 'Allure serve на localhost:8090'

    //dependsOn test

    commandLine 'allure', 'serve',
            'build/allure-results',
            '--host', 'localhost',
            '--port', '8090'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

